version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d test_task"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: api
    restart: always    
    volumes:
      - ./src:/app 
      - /app/.venv/
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  tests:
    profiles:
      - tests
    build:
      context: .
      dockerfile: Dockerfile
      target: test-runtime
    env_file:
      - .env    
    volumes:
      - ./pyproject.toml:/app/pyproject.toml
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
